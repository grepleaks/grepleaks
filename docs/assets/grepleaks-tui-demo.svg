<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="dTitle dDesc">
  <title id="dTitle">Grepleaks terminal demo</title>
  <desc id="dDesc">From the home screen, a pentest prompt is typed: Map this organization's external attack surface and identify potential entry points. The agent plans, runs subfinder, lists discovered hosts, and writes a report under /engagement.</desc>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0a222b"/><stop offset="1" stop-color="#060a0c"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .t-white { fill: #e8f4f8; }
    .t-cyan  { fill: #22d3ee; }
    .t-cyant { fill: #7dd3fc; }
    .t-cyand { fill: #4d7f8a; }
    .t-mut   { fill: #557079; }
    .t-green { fill: #00ff9c; }
    .t-amber { fill: #ffb000; }
    .home    { animation: h28s linear infinite; opacity: 1; }
    .session { opacity: 0; animation: s28s linear infinite; }
    .ph      { animation: ph28s linear infinite; }
    .cs      { fill: #22d3ee; animation: caret 1.06s steps(1) infinite, cs28s linear infinite; }
    .ce      { fill: #22d3ee; opacity: 0; animation: caret 1.06s steps(1) infinite, ce28s linear infinite; }
    .typed   { animation: ty28s linear infinite; }
    .b-bub   { animation: bBub linear infinite; }
    .b-intro { animation: bIntro linear infinite; }
    .b-cmd   { animation: bCmd linear infinite; }
    .b-o1    { animation: bO1 linear infinite; }
    .b-o2    { animation: bO2 linear infinite; }
    .b-o3    { animation: bO3 linear infinite; }
    .b-find  { animation: bFind linear infinite; }
    .b-rep   { animation: bRep linear infinite; }
    .b-comp  { animation: bComp linear infinite; }
    .beamA   { animation: beamA 13s ease-in-out infinite alternate; }
    .beamB   { animation: beamB 19s ease-in-out infinite alternate; }
    @keyframes caret { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    @keyframes h28s { 0%,29% { opacity: 1; } 32%,98% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes s28s { 0%,29% { opacity: 0; } 32%,97% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ph28s { 0%,5.9% { opacity: 1; } 7%,100% { opacity: 0; } }
    @keyframes cs28s { 0%,5.9% { opacity: 1; } 7%,100% { opacity: 0; } }
    @keyframes ce28s { 0%,26.9% { opacity: 0; } 27%,31% { opacity: 1; } 32%,100% { opacity: 0; } }
    @keyframes ty28s { 0%,6% { clip-path: inset(-10% 100% -10% 0); } 27%,100% { clip-path: inset(-10% 0% -10% 0); } }
    @keyframes bBub   { 0%,33%   { opacity: 0; transform: translateY(8px); } 35.5%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes bIntro { 0%,38%   { opacity: 0; transform: translateY(8px); } 40.5%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes bCmd   { 0%,43%   { opacity: 0; transform: translateY(8px); } 45.5%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes bO1    { 0%,46.9% { opacity: 0; } 48%,100%  { opacity: 1; } }
    @keyframes bO2    { 0%,48.9% { opacity: 0; } 50%,100%  { opacity: 1; } }
    @keyframes bO3    { 0%,50.9% { opacity: 0; } 52%,100%  { opacity: 1; } }
    @keyframes bFind  { 0%,57%   { opacity: 0; transform: translateY(8px); } 59.5%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes bRep   { 0%,66%   { opacity: 0; transform: translateY(8px); } 68.5%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes bComp  { 0%,74%   { opacity: 0; transform: translateY(8px); } 76.5%,100% { opacity: 1; transform: translateY(0); } }
    @keyframes beamA  { from { transform: translate(-60px,0); } to { transform: translate(60px,0); } }
    @keyframes beamB  { from { transform: translate(50px,0); } to { transform: translate(-50px,0); } }
    @media (prefers-reduced-motion: reduce) {
      .home,.session,.ph,.cs,.ce,.typed,.b-bub,.b-intro,.b-cmd,.b-o1,.b-o2,.b-o3,.b-find,.b-rep,.b-comp,.beamA,.beamB { animation: none !important; }
      .home { opacity: 0; }
      .session { opacity: 1; }
      .cs,.ce { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="878" height="558" rx="14" fill="url(#glow)" stroke="#16282e"/>

  <!-- ambient beams -->
  <g class="beamA" opacity="0.07" stroke="url(#beam)" stroke-width="46">
    <path d="M-80 120 L960 60"/><path d="M-80 470 L960 410"/>
  </g>
  <g class="beamB" opacity="0.05" stroke="url(#beam)" stroke-width="70">
    <path d="M-80 300 L960 250"/>
  </g>

  <!-- title bar -->
  <g>
    <circle cx="26" cy="17" r="5" fill="#ff5f57"/><circle cx="44" cy="17" r="5" fill="#febc2e"/><circle cx="62" cy="17" r="5" fill="#28c840"/>
    <text x="440.0" y="21" text-anchor="middle" font-size="11" class="t-mut">grepleaks — /engagement</text>
    <line x1="1" y1="34" x2="879" y2="34" stroke="#101d21"/>
  </g>

  <!-- ============================== HOME ============================== -->
  <g class="home">
    <text x="440.0" y="168" text-anchor="middle" font-size="52" font-weight="bold" letter-spacing="4"><tspan class="t-white">GREP</tspan><tspan class="t-cyan">LEAKS</tspan></text>
    <text x="440.0" y="222" text-anchor="middle" font-size="13" letter-spacing="3.5" class="t-cyant">YOUR AI PENTEST ENVIRONMENT</text>
    <text x="440.0" y="252" text-anchor="middle" font-size="11" class="t-mut">922 tools · bring your own model · install on demand</text>
    <text x="440.0" y="276" text-anchor="middle" font-size="11" class="t-mut"><tspan class="t-amber">● Tip </tspan> Use /models to switch between your saved model connections</text>

    <rect x="160" y="420" width="560" height="58" rx="10" fill="#0f1c20" stroke="#16282e"/>
    <rect x="176" y="433" width="7" height="13" fill="#22d3ee" class="cs"/>
    <text x="189" y="444" font-size="10" class="t-mut ph">Ask anything…</text>
    <g class="typed" style="clip-path: inset(-10% 100% -10% 0)">
      <text x="176" y="444" font-size="10" class="t-white" textLength="504.0" lengthAdjust="spacingAndGlyphs">Map this organization's external attack surface and identify potential entry points.</text>
    </g>
    <rect x="682" y="433" width="7" height="13" class="ce"/>
    <text x="176" y="464" font-size="10" class="t-mut"><tspan class="t-white">Build</tspan> · Grepleaks grepleaks</text>
    <text x="440.0" y="502" text-anchor="middle" font-size="10" class="t-cyand">tab to enable Auto mode&#160;&#160;·&#160;&#160;ctrl+p commands</text>
  </g>

  <!-- ============================= SESSION ============================ -->
  <g class="session">
    <!-- sidebar -->
    <rect x="604" y="35" width="275" height="524" fill="#0a1114"/>
    <line x1="604" y1="35" x2="604" y2="559" stroke="#16282e"/>
    <text x="618" y="60" font-size="10" class="t-cyand">┌ SESSION</text>
    <text x="618" y="80" font-size="13" font-weight="bold" class="t-white">External attack surface</text>
    <text x="618" y="118" font-size="12" font-weight="bold" class="t-white">▾ Pentest Tools</text>
    <text x="618" y="136" font-size="10" class="t-mut">922 tools · on demand</text>
    <text x="618" y="152" font-size="10" class="t-mut">Install → use → clean up</text>
    <g font-size="10">
      <text x="618" y="182" class="t-white">▸ Information Gathering <tspan class="t-mut">118</tspan></text>
      <text x="618" y="202" class="t-white">▸ Vulnerability Analysis <tspan class="t-mut">46</tspan></text>
      <text x="618" y="222" class="t-white">▸ Web Application Analysis <tspan class="t-mut">75</tspan></text>
      <text x="618" y="242" class="t-white">▸ Database Assessment <tspan class="t-mut">35</tspan></text>
      <text x="618" y="262" class="t-white">▸ Active Directory Attacks <tspan class="t-mut">82</tspan></text>
      <text x="618" y="282" class="t-white">▸ Command &amp; Control (C2) <tspan class="t-mut">26</tspan></text>
      <text x="618" y="302" class="t-white">▸ Cloud &amp; Container <tspan class="t-mut">74</tspan></text>
    </g>
    <text x="618" y="514" font-size="10.5" class="t-mut">/engagement</text>
    <text x="618" y="536" font-size="11"><tspan class="t-green">•</tspan><tspan class="t-white" font-weight="bold"> grepleaks</tspan><tspan class="t-mut"> local</tspan></text>

    <!-- user prompt bubble -->
    <g class="b-bub">
      <rect x="248" y="50" width="328" height="48" rx="10" fill="#0a1f14" stroke="#1c3d47"/>
      <text x="264" y="70" font-size="10.5" class="t-white">Map this organization's external attack</text>
      <text x="264" y="86" font-size="10.5" class="t-white">surface and identify potential entry points.</text>
    </g>

    <!-- agent intro -->
    <g class="b-intro" font-size="11">
      <text x="40" y="136" class="t-white">I'll map the lab organization's public assets, correlate exposed</text>
      <text x="40" y="154" class="t-white">services, and prioritize potential entry points.</text>
    </g>

    <!-- tool run card -->
    <g class="b-cmd">
      <rect x="40" y="176" width="520" height="96" rx="8" fill="#0a1114" stroke="#16282e"/>
      <text x="56" y="200" font-size="11"><tspan class="t-green">$</tspan><tspan class="t-white"> subfinder -d atlas.test -silent</tspan></text>
      <text x="56" y="224" font-size="11" class="b-o1 t-cyant">api.atlas.test</text>
      <text x="56" y="242" font-size="11" class="b-o2 t-cyant">staging.atlas.test</text>
      <text x="56" y="260" font-size="11" class="b-o3 t-cyant">vpn.atlas.test</text>
    </g>

    <!-- finding -->
    <g class="b-find" font-size="11">
      <text x="40" y="304" class="t-white">Staging and the remote-access portal deserve further investigation.</text>
      <text x="40" y="322" class="t-white">I'll verify their configuration before treating either as an entry point.</text>
    </g>

    <!-- report -->
    <g class="b-rep">
      <text x="40" y="360" font-size="11" class="t-white">Wrote <tspan class="t-cyant">/engagement/atlas/attack-surface.md</tspan></text>
      <text x="40" y="380" font-size="10" class="t-mut">▣ Build · Grepleaks</text>
    </g>

    <!-- follow-up composer -->
    <g class="b-comp">
      <rect x="40" y="466" width="520" height="58" rx="10" fill="#0f1c20" stroke="#16282e"/>
      <text x="69" y="490" font-size="10" class="t-mut">Ask a follow-up question…</text>
      <rect x="56" y="479" width="7" height="13" fill="#22d3ee" opacity="0.9">
      </rect>
      <text x="56" y="510" font-size="10" class="t-mut"><tspan class="t-white">Build</tspan> · Grepleaks grepleaks</text>
      <text x="544" y="510" text-anchor="end" font-size="10" class="t-cyand">tab Auto · ctrl+p commands</text>
    </g>
  </g>
</svg>

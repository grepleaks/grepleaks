version: 2
# Minor and patch updates are grouped into one PR per ecosystem each week.
# Major bumps are ignored on purpose: they change APIs (opentui, ai-sdk) and
# invalidate the exact versions pinned in `patchedDependencies` and patches/,
# so they are done by hand on a branch.
# 0.x @opentui minors, effect patches/minors, and @effect/* minors are
# excluded: the effect 4.0 beta -> stable transition removes the unstable
# HTTP modules, and these packages invalidate engine/patches/.
# drizzle-orm/drizzle-kit rc updates are handled manually while the ORM is
# pre-1.0. @modelcontextprotocol/sdk stays at 1.31.0 until its patch is
# ported to 1.32.
updates:
  - package-ecosystem: "bun"
    directory: "/engine"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      engine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@opentui/*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "effect"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@effect/*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "drizzle-orm"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "drizzle-kit"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types:
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

version: 2
# Minor and patch updates are grouped into one PR per ecosystem each week.
# Major bumps are ignored on purpose: they change APIs (opentui, ai-sdk) and
# invalidate the exact versions pinned in `patchedDependencies` and patches/,
# so they are done by hand on a branch.
# 0.x @opentui minors and effect minors are also excluded: they are breaking
# even though semver calls them minor, and they invalidate engine/patches/.
# drizzle-orm rc updates are handled manually while the ORM is pre-1.0.
updates:
  - package-ecosystem: "bun"
    directory: "/engine"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      engine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@opentui/*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "effect"
        update-types:
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

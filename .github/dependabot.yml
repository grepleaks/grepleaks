version: 2
# Minor and patch updates are grouped into one PR per ecosystem each week.
# Major bumps are ignored on purpose: they change APIs (opentui, ai-sdk) and
# invalidate the exact versions pinned in `patchedDependencies` and patches/,
# so they are done by hand on a branch.
updates:
  - package-ecosystem: "bun"
    directory: "/engine"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      engine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

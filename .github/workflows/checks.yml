name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash -n grepleaks docker/entrypoint.sh
        if: runner.os != 'Windows'
      - run: python -m py_compile scripts/install.py scripts/launch.py scripts/repair-db.py scripts/smoke-container.py
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: engine
      - run: >-
          bun audit --audit-level=high
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-hp3w-g68c-fv3c
        working-directory: engine
      - run: bun typecheck
        working-directory: engine/packages/opencode
      - run: bun typecheck
        working-directory: engine/packages/tui
      - run: bun test test/provider/provider.test.ts test/provider/transform.test.ts test/plugin/loader-shared.test.ts
        working-directory: engine/packages/opencode
      - run: bun test test/permission test/auth test/session --timeout 30000 --only-failures
        working-directory: engine/packages/opencode
      - run: bun test --timeout 30000 --only-failures
        working-directory: engine/packages/tui

name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash -n grepleaks docker/entrypoint.sh
        if: runner.os != 'Windows'
      - run: python -m py_compile scripts/install.py scripts/launch.py scripts/smoke-container.py
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: curl -fsSL https://bun.sh/install | bash -s -- bun-v1.4.2
      - run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        working-directory: engine
      - run: bun typecheck
        working-directory: engine/packages/opencode
      - run: bun typecheck
        working-directory: engine/packages/tui
      - run: bun test test/provider/provider.test.ts test/provider/transform.test.ts test/plugin/loader-shared.test.ts
        working-directory: engine/packages/opencode
      - run: bun test test/permission test/auth test/session --timeout 30000 --only-failures
        working-directory: engine/packages/opencode
      - run: bun test --timeout 30000 --only-failures
        working-directory: engine/packages/tui
